# コラムの予約公開（2026年11月10日〜 新しいデザイン用に作り直し）
#
# 毎朝 6:41（日本時間）に、scheduled/site ブランチの .scheduled/<今日の日付>/ を見る。
# その日の分があれば、サイトの HTML・sitemap.xml・robots.txt・css を丸ごと差し替えて main に反映し、公開する。
# 予約分は社長の Mac の _build/build_schedule.py でまとめて作る（公開日ごとのサイト全体）。
#
# 安全装置：各予約分には EXPECTED（差し替える直前の main の指紋）が入っている。
# 予約を作ったあとに main が手で変えられていたら（指紋が合わなければ）、上書きせずに失敗で止める。
# → GitHub からメールが届く。予約分を作り直してから、Actions で手動実行する。
name: コラムの予約公開

on:
  schedule:
    - cron: "41 21 * * *" # 毎朝 6:41（日本時間）
  workflow_dispatch: # 手動ですぐ実行したいとき用

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 今日の分を公開
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 今日の予約分を取り出す
        id: pick
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          git fetch --depth 1 origin scheduled/site
          if git cat-file -e "FETCH_HEAD:.scheduled/$today/index.html" 2>/dev/null; then
            mkdir -p /tmp/sched
            git archive FETCH_HEAD ".scheduled/$today" | tar -x -C /tmp/sched
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "今日（$today）の予約分があります"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "今日（$today）の予約分はありません"
          fi

      - name: main が予約を作ったときのままか確かめる
        if: steps.pick.outputs.found == 'yes'
        run: |
          dir="/tmp/sched/.scheduled/${{ steps.pick.outputs.today }}"
          expected=$(tr -d '[:space:]' < "$dir/EXPECTED")
          actual=$(python3 .github/scripts/site_hash.py .)
          if [ "$expected" != "$actual" ]; then
            echo "::error::予約を作ったあとに main が変わっています。上書きせずに止めました。Mac の _build/build_schedule.py で予約分を作り直してください。"
            exit 1
          fi

      - name: サイトを差し替える
        if: steps.pick.outputs.found == 'yes'
        run: |
          dir="/tmp/sched/.scheduled/${{ steps.pick.outputs.today }}"
          rm -f ./*.html
          cp "$dir"/*.html "$dir/sitemap.xml" "$dir/robots.txt" .
          cp "$dir/css/style.css" css/style.css
          echo "NOTE=$(cat "$dir/NOTE" 2>/dev/null || echo 予約公開)" >> "$GITHUB_ENV"

      - name: 公開前チェック
        if: steps.pick.outputs.found == 'yes'
        run: python3 .github/scripts/check_site.py .

      - name: main に反映する
        if: steps.pick.outputs.found == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' sitemap.xml robots.txt css/style.css
          git commit -m "予約公開（${{ steps.pick.outputs.today }}）：$NOTE"
          git push origin main

      - name: ホームページを公開する
        if: steps.pick.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
